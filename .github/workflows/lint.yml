name: lint

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Byte-compile the plug-in
        run: |
          python -m py_compile lama-cleanup.py
          python -m py_compile tests/gimp_e2e.py
          python -m py_compile tests/real_check.py
      - name: Lint
        run: |
          pip install ruff
          ruff check --target-version py313 --select E,F,W,B,UP,SIM,C4,RET,ARG --ignore E501 .
